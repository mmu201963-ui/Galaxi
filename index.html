<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GALAXI V22</title><style>body{margin:0;background:#0b1017;color:#e9eef5;font:15px system-ui;padding:24px}main{max-width:1100px;margin:auto}h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.card{background:#111923;border:1px solid #263342;border-radius:14px;padding:15px}.v{font-size:24px;font-weight:700;margin-top:6px}.err{color:#ff8e8e}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}pre{white-space:pre-wrap}</style></head><body><main><h1>GALAXI V22</h1><div id="sub">Cargando…</div><div class="grid" id="grid"></div><div class="card" style="margin-top:12px"><b>Última señal</b><pre id="signal">—</pre></div><div class="card" style="margin-top:12px"><b>Error</b><pre id="error" class="err">—</pre></div></main><script>async function tick(){try{const s=await fetch('/api/state').then(r=>r.json());document.querySelector('#sub').textContent=`Modo ${s.mode} · IA ${s.aiModel} · WS ${s.wsConnected?'CONECTADO':'DESCONECTADO'}`;const vals=[['Ciclos',s.cycle],['Mercados',s.symbols],['Candidatos',s.candidates],['Posiciones',s.positions?.length||0],['Equity',Number(s.equity||0).toFixed(2)],['PnL realizado',Number(s.realizedPnl||0).toFixed(2)],['Régimen',s.regime],['Long/Short',`${s.longPct}% / ${s.shortPct}%`]];document.querySelector('#grid').innerHTML=vals.map(x=>`<div class="card"><div>${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');document.querySelector('#signal').textContent=s.lastSignal||'—';document.querySelector('#error').textContent=s.lastError||'Sin errores';}catch(e){document.querySelector('#error').textContent=e.message}}tick();setInterval(tick,3000)</script></body></html>
